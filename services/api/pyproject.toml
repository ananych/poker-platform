[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "poker-api"
version = "0.3.0"
description = "Private Texas Hold'em — FastAPI modular monolith"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg>=0.29,<1",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings>=2.4,<3",
  "argon2-cffi==25.1.0",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.168.5",
  "httpx==0.28.1",
  "websockets>=13",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]  # FastAPI Depends idiom; str-Enum kept for JSON

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
