# Local dev stack: PostgreSQL + API. Web runs with `npm run dev` in apps/web.
name: poker-platform
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./initdb:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker"]
      interval: 3s
      retries: 20

  api:
    build: ../services/api
    env_file: ../.env
    environment:
      POKER_DATABASE_URL: postgresql+asyncpg://poker:poker@db:5432/poker
      POKER_COOKIE_SECURE: "false"   # local http only
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
