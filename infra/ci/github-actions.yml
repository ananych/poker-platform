# GitHub Actions CI — move to .github/workflows/ci.yml once your GitHub token has the
# `workflow` scope (GitHub refuses workflow files pushed with a token lacking it).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poker" --health-interval 5s --health-retries 10
    env:
      POKER_DATABASE_URL: postgresql+asyncpg://poker:poker@localhost:5432/poker_test
      POKER_TEST_DATABASE_URL: postgresql+asyncpg://poker:poker@localhost:5432/poker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests migrations && ruff format --check app tests migrations
      - name: Migrations apply, match models, and roll back
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poker" --health-interval 5s --health-retries 10
    env:
      POKER_DATABASE_URL: postgresql+asyncpg://poker:poker@localhost:5432/poker
      POKER_ENV: dev
      POKER_COOKIE_SECURE: "false"
      POKER_GUEST_SESSIONS_PER_IP_PER_MINUTE: "1000"
      POKER_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start API
        working-directory: services/api
        run: |
          pip install -e ".[dev]" websockets
          export POKER_DATA_ENCRYPTION_KEY=$(python -c "from app.security.crypto import Cipher;print(Cipher.generate_key())")
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 --workers 1 > api.log 2>&1 &
          sleep 3 && curl -fsS localhost:8000/health/ready
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/
          PORT=3000 nohup node .next/standalone/server.js > web.log 2>&1 &
          sleep 3 && curl -fsS -o /dev/null localhost:3000/
      - name: Playwright (phone + desktop)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Capacity smoke (30 users, 30 s)
        working-directory: services/api
        run: python scripts/loadtest.py --users 30 --per-room 6 --seconds 30
